name: ci

on:
  push:
    branches: ["main"]
    paths:
      - "capstone/**"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "capstone/**"
      - ".github/workflows/ci.yml"

permissions:
  contents: read

jobs:

  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: capstone
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v8
        with:
          enable-cache: true
          cache-dependency-glob: "capstone/uv.lock"

      - name: Install deps (exactly what uv.lock says)
        run: uv sync --frozen

      - name: Lint
        run: uv run ruff check .

      - name: Test
        run: uv run pytest -v